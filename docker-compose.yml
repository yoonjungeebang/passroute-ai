services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  fastapi-blue:
    image: ${DEPLOY_IMAGE:-yaejin02/passroute-ai:develop}
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - blue

  fastapi-green:
    image: ${DEPLOY_IMAGE:-yaejin02/passroute-ai:develop}
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - green

  redis:
    image: redis:7
    expose:
      - "6379"
    restart: unless-stopped
